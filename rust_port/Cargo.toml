[package]
name = "open_duck_playground"
version = "0.1.0"
edition = "2024"

[features]
default = []
mujoco = ["dep:mujoco-rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
itertools = "0.12"
ordered-float = "4.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mujoco-rs = { version = "2.0.1+mj-3.3.7", default-features = false, features = ["viewer"], optional = true }
